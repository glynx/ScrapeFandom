[project]
name = "scrape-fandom"
version = "0.1.0"
description = "Scrape Fandom wikis and build compact target-specific wordlists."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.24.0",
    "tqdm>=4.67.3",
    "wikiextractor>=3.0.6",
    "wordfreq>=3.1.1",
]

[project.scripts]
fandom-jsonl = "json2jsonl:main"
fandom-pipeline = "fandom_pipeline:main"
fandom-scrape = "ScrapeFandom:main"
fandom-wikis = "list_fandom_wikis:main"
fandom-wordlist = "jsonl2wordlist:main"
wikiextractor-compat = "run_wikiextractor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ScrapeFandom.py",
    "fandom_pipeline.py",
    "json2jsonl.py",
    "jsonl2wordlist.py",
    "list_fandom_wikis.py",
    "run_wikiextractor.py",
]
